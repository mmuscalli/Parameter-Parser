[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parameter-extractor"          # working name -- rename before public release
version = "0.1.0"
description = "Extract experimental parameters from prebiotic peptide-synthesis papers into a structured dataset using the Claude API."
readme = "README.md"
requires-python = ">=3.10"
# license: not chosen yet -- must be decided before a public release.
dependencies = [
    "anthropic>=1.13",      # structured outputs via messages.stream(output_format=...)
    "pydantic>=2.6",
    "python-dotenv>=1.0",   # CLI convenience only (config/.env)
    "pdfplumber>=0.11",     # text extraction (MIT)
    "pypdfium2>=4.0",       # page rendering (BSD/Apache)
    "Pillow>=10.0",
    "requests>=2.31",       # CrossRef DOI lookup
]

[project.scripts]
parameter-extract = "parameter_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parameter_extractor = ["prompts/*.md", "schemas/*.json"]
