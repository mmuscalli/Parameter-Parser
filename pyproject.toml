[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parameter-extractor"          # working name -- rename before public release
version = "0.1.0"
description = "Extract experimental parameters from prebiotic peptide-synthesis papers into a structured dataset using the Claude API."
readme = "README.md"
requires-python = ">=3.10"
# license: not chosen yet -- must be decided before a public release.
dependencies = [
    "anthropic>=1.13",      # structured outputs via messages.stream(output_format=...)
    "pydantic>=2.6",
    "python-dotenv>=1.0",   # CLI convenience only (config/.env)
    "pdfplumber>=0.11",     # text extraction (MIT)
    "pypdfium2>=4.0",       # page rendering (BSD/Apache)
    "Pillow>=10.0",
    "requests>=2.31",       # CrossRef DOI lookup
    "numpy>=1.26",          # digitizer automation: axis and marker detection in the page image
]

[project.optional-dependencies]
# Desktop app: pip install -e ".[gui]". Essentials only -- the full PySide6
# package adds ~1 GB of Qt modules (web engine, 3D, ...) the app doesn't use.
gui = [
    "PySide6-Essentials>=6.11,<6.12",   # LGPL; 6.12.0 was <2 weeks old when this was pinned
    "keyring>=25",                      # API key in the OS keychain (MIT)
]
# Building the standalone app (packaging/build_macos.sh). Pinned to versions
# that were >= 2 weeks old when chosen.
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.7",
]

[project.scripts]
parameter-extract = "parameter_extractor.cli:main"

[project.gui-scripts]
parameter-extractor-gui = "parameter_extractor.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parameter_extractor = ["prompts/*.md", "schemas/*.json", "gui/resources/*.png"]
